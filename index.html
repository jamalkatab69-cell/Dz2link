<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>عبور</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- النتيجة أثناء اللعب -->
  <div id="score" class="score" hidden>0</div>
  <div id="gems" class="gems" hidden>0</div>

  <!-- شاشة البداية -->
  <section class="screen" id="screenStart">
    <div class="logo">عبور</div>
    <p class="hint">المس يمين الشاشة لتدور الكرة يمينًا<br>والمس يسارها لتدور يسارًا</p>
    <p class="tap">المس للبدء</p>
    <small id="bestStart"></small>
  </section>

  <!-- شاشة الخسارة -->
  <section class="screen over" id="screenOver" hidden>
    <div class="verdict" id="verdict"></div>
    <div class="final" id="final">0</div>
    <div class="meta"><span id="bestOver"></span><span id="gemsOver"></span></div>
    <p class="tap">المس للعب مجددًا</p>
  </section>

  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
