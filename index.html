<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>عبور — لعبة الكرة والمثلثات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1) خلفية اللعبة: فيديو مرسول -->
  <video id="bg" class="bg" src="assets/background.mp4" autoplay muted loop playsinline preload="auto"></video>

  <!-- اللعبة: الطريق والمثلثات والكرة -->
  <canvas id="game"></canvas>

  <!-- شريط التقدم -->
  <div class="hud" id="hud" hidden>
    <div class="bar"><i id="barFill"></i></div>
    <span id="pct">0%</span>
  </div>

  <!-- شاشة البداية -->
  <section class="screen" id="screenStart">
    <h1>عبور</h1>
    <p>الكرة تجري والطريق ثابت.<br>المس يسار الشاشة لتتحرك يسارًا، ويمينها لتتحرك يمينًا.</p>
    <button id="btnStart" class="btn">ابدأ</button>
    <small id="bestStart"></small>
  </section>

  <!-- شاشة الاصطدام -->
  <section class="screen" id="screenOver" hidden>
    <h2>اصطدمت بمثلث</h2>
    <p id="overText"></p>
    <button id="btnRetry" class="btn">حاول مرة أخرى</button>
  </section>

  <!-- شاشة الفوز -->
  <section class="screen" id="screenWin" hidden>
    <h2>عبرت الطريق كله</h2>
    <p id="winText"></p>
    <button id="btnAgain" class="btn">العب مجددًا</button>
  </section>

  <script src="game.js"></script>
</body>
</html>
